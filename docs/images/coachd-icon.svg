<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="95 51 480 480" role="img" aria-labelledby="title desc">
  <title id="title">coachd</title>
  <desc id="desc">A navy C-shaped sports emblem, with running, cycling and strength training above a rising green trail.</desc>
