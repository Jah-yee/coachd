    L 276,235 Q 287,245 297,233
    L 357,168 Q 369,154 382,166
    L 455,218 C 467,227 477,228 488,217
    L 530,178 C 538,170 538,157 529,149 Z"/>
  <!-- Curving green path is a distinct flat vector shape -->
