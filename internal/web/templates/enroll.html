{{define "title"}}Enrol a passkey{{end}}
{{define "content"}}
<h1>Enrol a passkey</h1>
<p>This page works only from the link <code>coachd enroll</code> printed on the host. The link is valid for 10 minutes and works once.</p>
<form class="stack" data-action="enroll">
<label for="label">Name for this passkey (optional)</label>
<input id="label" name="label" type="text" maxlength="40" autocomplete="off" placeholder="phone">
<button type="submit" class="primary">Create passkey</button>
</form>
{{end}}
